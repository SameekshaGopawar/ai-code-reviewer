name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (informational, does not fail the build)
        run: |
          pylint ai_code_reviewer --exit-zero
          flake8 ai_code_reviewer --exit-zero
          bandit -r ai_code_reviewer --exit-zero

      - name: Run tests with coverage
        run: python -m pytest tests/ -v --cov=ai_code_reviewer --cov-report=term-missing
