name: "AI Code Reviewer"
description: "Runs static analysis + an LLM review on changed Python files and posts the result as a PR comment."
inputs:
  openai-api-key:
    description: "OpenAI API key used for the LLM review"
    required: true
  github-token:
    description: "Token used by `gh` to post the PR comment"
    required: true
  base-ref:
    description: "Base branch to diff against"
    required: false
    default: "main"
  pr-number:
    description: "Pull request number to comment on"
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      shell: bash
      # Installs the reviewer's own dependencies (openai, pylint, flake8, bandit, ...)
      # from its own repo, not the calling repo's requirements.txt -- this action can
      # be invoked either from within this repo or via
      # `uses: SameekshaGopawar/ai-code-reviewer/.github/actions/ai-code-review@master`
      # from a different repo, so paths to this action's own files must be resolved
      # via github.action_path rather than assumed relative to the caller's workspace.
      run: pip install -r "${{ github.action_path }}/../../../requirements.txt"

    - name: Run AI review and post PR comment
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        BASE_REF: ${{ inputs.base-ref }}
      # Runs against the calling repo's checked-out working directory (correct --
      # that's where the PR's actual git history/diff lives), but loads the script
      # itself from this action's own repo.
      run: python "${{ github.action_path }}/../../../scripts/post_pr_review.py"
